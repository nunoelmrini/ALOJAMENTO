<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O meu quarto</title>
<style>:root{color-scheme:light dark;--bg:#f4f1ea;--c:#fff;--t:#1d2433;--m:#6b7385;--a:#1f7a5a;--r:#c0392b;--w:#b7791f}@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--c:#171e2e;--t:#e8ecf5;--m:#9aa3b8;--a:#35c38f;--r:#ff7a6b;--w:#f0b44c}}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}main{max-width:520px;margin:0 auto;padding:14px}.card{background:var(--c);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.12)}.hero{background:var(--a);color:#fff}.hero .q{font-size:2.6rem;font-weight:800;line-height:1}.hero small{color:#fff;opacity:.9}.big{font-size:1.5rem;font-weight:700}.ok{color:var(--a)}.bad{color:var(--r)}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}.pill.ok{background:var(--a);color:#fff}.pill.bad{background:var(--r);color:#fff}.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}small{color:var(--m)}button{padding:9px 14px;border:0;border-radius:8px;background:var(--a);color:#fff;font-weight:600;cursor:pointer;margin:6px 6px 0 0}button.g{background:transparent;color:var(--t);border:1px solid #8886}input,textarea,select{width:100%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #8884;background:transparent;color:inherit}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid #8883;text-align:left}th{color:var(--m);font-weight:600}</style></head><body><main><div id="app"><small>A carregar…</small></div>
<div id="frm" class="card" style="display:none"><b>Enviar ao senhorio</b><select id="tp"><option value="comprovativo">Comprovativo de pagamento</option><option value="manutencao">Pedido de manutenção</option><option value="mensagem">Mensagem</option></select><textarea id="tx" maxlength="900" rows="3" placeholder="Escreve aqui"></textarea><input type="file" id="ft" accept="image/*"><button id="sd">Enviar</button><small id="rs"></small></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>firebase.initializeApp({apiKey:"AIzaSyCwULDIMegxK5qpk7KN3x4jvwbdwN8HSWw",authDomain:"alojamentovalenca-66035.firebaseapp.com",projectId:"alojamentovalenca-66035",appId:"1:401234375880:web:b41eb60bc1c0cd791ee1fd"});const db=firebase.firestore(),$=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const T=new URLSearchParams(location.search).get('t'),eur=v=>Number(v||0).toFixed(2).replace('.',',')+' €',dt=s=>s?s.split('-').reverse().join('/'):'—';let P=null,N=6;
function chart(){const m=P.casa.mensal.slice(-N),mx=Math.max(1,...m.map(x=>x.v)),w=100/Math.max(m.length,1);return '<svg viewBox="0 0 300 130" width="100%">'+m.map((x,i)=>{const h=Math.round(x.v/mx*80),bx=i*(300/m.length)+6,bw=300/m.length-12;return '<rect x="'+bx+'" y="'+(100-h)+'" width="'+bw+'" height="'+h+'" rx="4" fill="var(--a)"/><text x="'+(bx+bw/2)+'" y="'+(94-h)+'" font-size="9" text-anchor="middle" fill="currentColor">'+Math.round(x.v)+'</text><text x="'+(bx+bw/2)+'" y="116" font-size="9" text-anchor="middle" fill="currentColor" opacity=".7">'+esc(x.mk)+'</text>';}).join('')+'</svg>';}
function st(p){return '<span class="pill '+(p?'ok':'bad')+'">'+(p?'Pago':'Por pagar')+'</span>';}
function draw(){const p=P,n=p.now,dias=p.fim?Math.ceil((new Date(p.fim+'T00:00:00')-new Date(new Date().toDateString()))/864e5):null;
let h='<div class="card hero"><small>Olá, '+esc(p.nome)+'</small><div class="q">Quarto '+esc(p.quarto)+'</div><div style="margin-top:8px">Contrato até <b>'+dt(p.fim)+'</b>'+(dias!=null?' · '+(dias<0?'terminado':(dias<=60?'<b>faltam '+dias+' dias</b>':'faltam '+dias+' dias')):'')+'</div></div>';
h+='<div class="card"><b>Despesas da '+esc(p.casa.nome)+'</b> <small>(total da casa)</small><div style="margin:6px 0"><button class="'+(N===6?'':'g')+'" id="b6">6 meses</button><button class="'+(N===12?'':'g')+'" id="b12">Ano</button></div>'+chart()+'</div>';
if(n){h+='<div class="card"><b>Estado de '+esc(p.mes)+'</b><div class="row"><span>Renda</span><span class="big">'+eur(n.r)+'</span></div><div class="row"><span></span>'+st(n.rp)+'</div><div class="row"><span>Despesas (água, luz, internet)</span><span class="big">'+eur(n.d)+'</span></div>'+p.det.map(x=>'<div class="row"><small>'+esc(x.c)+'</small><small>'+eur(x.v)+'</small></div>').join('')+'<div class="row"><span></span>'+(n.d>0?st(n.dp):'<span class="pill" style="background:#8a8f9c">Faturas ainda não lançadas</span>')+'</div><hr style="border:0;border-top:1px solid #8883"><div class="row"><b>Total a pagar este mês</b><span class="big">'+eur(p.total)+'</span></div><div class="row"><span>Ainda por pagar</span><b class="'+(((n.rp?0:n.r)+(n.dp?0:n.d))>0?'bad':'ok')+'">'+eur((n.rp?0:n.r)+(n.dp?0:n.d))+'</b></div></div>';}
h+='<div class="card"><b>Como pagar</b><div style="margin:8px 0"><b>Transferência (NIB)</b>'+(p.ibanLabel?' <small>'+esc(p.ibanLabel)+'</small>':'')+'<div style="word-break:break-all;font-size:1.05rem"><b id="ib">'+esc(p.iban)+'</b></div><button id="cb">Copiar NIB</button><br><small>Titular: '+esc(p.titular)+(p.referencia?' · Referência: <b>'+esc(p.referencia)+'</b>':'')+'</small></div>'+(p.mbway?'<div style="margin:8px 0"><b>MB Way</b> '+esc(p.mbway)+'<br><small>'+(p.mbwayRenda?'Renda e despesas':'Só despesas')+'</small></div>':'')+(p.dinheiro?'<div style="margin:8px 0"><b>Dinheiro</b><br><small>Também podes pagar em dinheiro (combina com o senhorio).</small></div>':'')+'</div>';
h+='<div class="card"><b>Pagamentos</b><table><tr><th>Mês</th><th>Renda</th><th>Despesas</th></tr>'+p.meses.slice().reverse().map(x=>'<tr><td>'+esc(x.mk)+'</td><td>'+eur(x.r)+' '+(x.rp?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+'</td><td>'+(x.d>0?eur(x.d)+' '+(x.dp?'<span class="ok">✓</span>':'<span class="bad">✗</span>'):'<small>sem faturas</small>')+'</td></tr>').join('')+'</table></div><small>Atualizado em '+dt((p.at||'').slice(0,10))+'</small>';
$('app').innerHTML=h;$('frm').style.display='block';$('cb').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(p.iban);$('cb').textContent='Copiado';};$('b6').onclick=()=>{N=6;draw();};$('b12').onclick=()=>{N=12;draw();};}
function comp(f){return new Promise((res,rej)=>{if(!f)return res('');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>300000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q);}res(d);};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});}
$('sd').onclick=async()=>{const t=$('tx').value.trim();if(!t){$('rs').textContent=' Escreve uma mensagem.';return;}try{await db.collection('pedidos').add({token:T,quarto:P.quarto,tipo:$('tp').value,mes:P.mes,texto:t,foto:await comp($('ft').files[0]),estado:'novo',at:new Date().toISOString()});$('rs').textContent=' Enviado. Obrigado!';$('tx').value='';}catch(e){$('rs').textContent=' Não foi possível enviar.';}};
if(!T)$('app').innerHTML='<div class="card">Link inválido.</div>';else db.collection('portal').doc(T).get().then(d=>{if(!d.exists){$('app').innerHTML='<div class="card">Este link já não está ativo. Se o teu contrato continua, pede um novo link ao senhorio.</div>';return;}P=d.data();draw();}).catch(()=>{$('app').innerHTML='<div class="card">Erro a carregar.</div>';});</script></body></html>
