<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>O meu quarto</title>
<style>:root{color-scheme:light dark;--bg:#f6f4ef;--c:#fff;--t:#1d2433;--m:#6b7385;--a:#1f7a5a}@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--c:#171e2e;--t:#e8ecf5;--m:#9aa3b8;--a:#35c38f}}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}main{max-width:520px;margin:0 auto;padding:16px}.card{background:var(--c);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.12)}.big{font-size:1.8rem;font-weight:700}.ok{color:#2e9e6b}.no{color:#d24a4a}.chip{display:inline-block;margin:3px;padding:4px 8px;border-radius:99px;font-size:12px;border:1px solid #8884}button{margin:6px 6px 0 0;padding:9px 14px;border:0;border-radius:8px;background:var(--a);color:#fff;font-weight:600;cursor:pointer}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #8884;background:transparent;color:inherit}small{color:var(--m)}</style></head><body><main><div id="app"><small>A carregar…</small></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>firebase.initializeApp({apiKey:"AIzaSyCwULDIMegxK5qpk7KN3x4jvwbdwN8HSWw",authDomain:"alojamentovalenca-66035.firebaseapp.com",projectId:"alojamentovalenca-66035",appId:"1:401234375880:web:b41eb60bc1c0cd791ee1fd"});const db=firebase.firestore(),T=new URLSearchParams(location.search).get('t'),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>(Number(n)||0).toFixed(2).replace('.',',')+' €';let D=null,foto='';
function comp(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q);}res(d);};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});}
function show(){const m=D.mesAtual,pago=m&&m.pago,a=document.getElementById('app');a.innerHTML='<h2>Olá '+esc(D.nome)+'</h2><small>Quarto '+esc(D.quarto)+(D.fim?' · contrato até '+esc(D.fim):'')+'</small>'+
(m?'<div class="card"><small>Renda de '+esc(m.mk)+'</small><div class="big">'+fmt(m.v)+'</div><b class="'+(pago?'ok':'no')+'">'+(pago?'✓ Pago':'Por pagar (vence dia 1)')+'</b>'+(D.penal&&!pago?'<br><small>Atrasos podem ter penalização de '+esc(D.penal)+'%.</small>':'')+'</div>':'')+
'<div class="card"><b>Como pagar</b><br>'+(D.titular?'Titular: '+esc(D.titular)+'<br>':'')+'IBAN: <b id="ib">'+esc(D.iban)+'</b> <button id="cp">Copiar</button>'+(D.referencia?'<br>Referência: <b>'+esc(D.referencia)+'</b>':'')+'</div>'+
'<div class="card"><b>Últimos meses</b><br>'+D.meses.map(x=>'<span class="chip '+(x.pago?'ok':'no')+'">'+esc(x.mk)+' '+(x.pago?'✓':'✗')+'</span>').join('')+'</div>'+
'<div class="card"><b>Enviar comprovativo ou pedido</b><select id="tp"><option value="comprovativo">Comprovativo de pagamento</option><option value="manutencao">Pedido de manutenção</option><option value="mensagem">Mensagem</option></select><textarea id="tx" placeholder="Descrição (opcional)" maxlength="1000"></textarea><input type="file" id="ft" accept="image/*"><button id="sd">Enviar</button><div id="rs"></div></div>'+(D.whatsapp?'<a href="https://wa.me/'+D.whatsapp.replace(/\D/g,'')+'"><button>Falar por WhatsApp</button></a>':'');
document.getElementById('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(D.iban);document.getElementById('ft').onchange=async e=>{foto=e.target.files[0]?await comp(e.target.files[0]):'';};
document.getElementById('sd').onclick=async()=>{const tp=document.getElementById('tp').value,r=document.getElementById('rs');try{await db.collection('pedidos').add({token:T,quarto:D.quarto,tipo:tp,mes:m?m.mk:'',texto:document.getElementById('tx').value.trim(),foto:foto,estado:'novo',at:new Date().toISOString()});r.textContent='Enviado. Obrigado!';document.getElementById('tx').value='';foto='';}catch(e){r.textContent='Não foi possível enviar. Tenta por WhatsApp.';}};}
if(!T){document.getElementById('app').innerHTML='<small>Link inválido.</small>';}else db.collection('portal').doc(T).get().then(d=>{if(!d.exists){document.getElementById('app').innerHTML='<small>Link inválido ou revogado. Pede um novo ao senhorio.</small>';return;}D=d.data();show();}).catch(()=>{document.getElementById('app').innerHTML='<small>Erro a carregar.</small>';});</script></body></html>
