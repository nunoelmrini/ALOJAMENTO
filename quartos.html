<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quartos disponíveis</title>
<style>:root{color-scheme:light dark;--bg:#f6f4ef;--c:#fff;--t:#1d2433;--m:#6b7385;--a:#1f7a5a}@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--c:#171e2e;--t:#e8ecf5;--m:#9aa3b8;--a:#35c38f}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.4rem}.card{background:var(--c);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.12)}.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--a);color:#fff}.tag.n{background:#8a8f9c}.ph{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.ph img{height:140px;border-radius:8px}button,a.b{display:inline-block;margin:6px 6px 0 0;padding:9px 14px;border:0;border-radius:8px;background:var(--a);color:#fff;font-weight:600;text-decoration:none;cursor:pointer;font-size:14px}input,textarea{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #8884;background:transparent;color:inherit}small{color:var(--m)}</style></head><body><main><h1>Quartos disponíveis</h1><label><input type="checkbox" id="only" checked style="width:auto"> Mostrar só os livres</label><div id="app"><small>A carregar…</small></div>
<div id="form" class="card" style="display:none"><b>Tenho interesse — <span id="fq"></span></b><input id="n" placeholder="Nome" maxlength="80"><input id="c" placeholder="Telemóvel ou e-mail" maxlength="80"><input id="o" placeholder="Curso / ocupação" maxlength="80"><input id="e" type="date"><textarea id="m" placeholder="Mensagem" maxlength="500"></textarea><label><small><input type="checkbox" id="k" style="width:auto"> Autorizo o uso destes dados apenas para contacto sobre este alojamento.</small></label><br><button id="s">Enviar</button><span id="r"></span></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>firebase.initializeApp({apiKey:"AIzaSyCwULDIMegxK5qpk7KN3x4jvwbdwN8HSWw",authDomain:"alojamentovalenca-66035.firebaseapp.com",projectId:"alojamentovalenca-66035",appId:"1:401234375880:web:b41eb60bc1c0cd791ee1fd"});const db=firebase.firestore(),$=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let D=null,Q=new URLSearchParams(location.search).get('q'),sel=null;
async function photos(ids,el){for(const id of (ids||[]).slice(0,6)){try{const d=await db.collection('publicPhotos').doc(id).get();if(d.exists){const i=document.createElement('img');i.src=d.data().data;el.appendChild(i);}}catch(e){}}}
function render(){const only=$('only').checked,app=$('app');app.innerHTML='';['baixo','cima'].forEach(h=>{const H=D.houses[h],rs=D.rooms.filter(r=>r.house===h&&(!only||r.livre)&&(!Q||r.id===Q));if(!rs.length&&!(!only&&!Q))return;const c=document.createElement('div');c.className='card';c.innerHTML='<h2>'+esc(H.nome)+'</h2><small>'+esc(H.zona)+'</small><p>'+esc(H.desc)+'</p>'+(H.regras?'<small>Regras: '+esc(H.regras)+'</small>':'')+'<div class="ph"></div>';photos(H.fotos,c.querySelector('.ph'));app.appendChild(c);
rs.forEach(r=>{const x=document.createElement('div');x.className='card';x.innerHTML='<b>Quarto '+esc(r.id)+'</b> <span class="tag '+(r.livre?'':'n')+'">'+(r.livre?'Livre'+(r.desde?' · desde '+esc(r.desde):''):'Ocupado')+'</span><p><b>'+esc(r.preco)+' €/mês</b> · '+esc(r.area)+' m² · '+esc(r.cama)+' · WC '+esc(r.wc)+'</p><p>'+esc(r.desc)+'</p><div class="ph"></div>';photos(r.fotos,x.querySelector('.ph'));
if(D.whatsapp){const a=document.createElement('a');a.className='b';a.textContent='WhatsApp';a.href='https://wa.me/'+D.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('Olá, tenho interesse no quarto '+r.id);x.appendChild(a);}
const b=document.createElement('button');b.textContent='Tenho interesse';b.onclick=()=>{sel=r.id;$('fq').textContent='quarto '+r.id;$('form').style.display='block';$('form').scrollIntoView({behavior:'smooth'});};x.appendChild(b);app.appendChild(x);});});if(!app.children.length)app.innerHTML='<small>Sem quartos para mostrar.</small>';}
$('only').onchange=render;$('s').onclick=async()=>{const n=$('n').value.trim(),c=$('c').value.trim();if(!n||!c||!$('k').checked){$('r').textContent=' Preenche nome, contacto e autorização.';return;}try{await db.collection('candidatos').add({nome:n,contacto:c,ocupacao:$('o').value.trim(),entrada:$('e').value,mensagem:$('m').value.trim(),roomId:String(sel||''),estado:'novo',consent:true,at:new Date().toISOString()});$('r').textContent=' Enviado. Obrigado!';['n','c','o','e','m'].forEach(i=>$(i).value='');}catch(e){$('r').textContent=' Não foi possível enviar. Tenta por WhatsApp.';}};
db.collection('public').doc('casa').get().then(d=>{if(!d.exists){$('app').innerHTML='<small>Sem informação disponível.</small>';return;}D=d.data();render();}).catch(()=>{$('app').innerHTML='<small>Erro a carregar.</small>';});</script></body></html>
